name: Set up Python
description: Python 3.14.10, optionally with the hash-pinned requirements installed
inputs:
  install:
    description: Install requirements.txt (with pip cache); "false" for jobs that need the standard library only
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.14.10"
        cache: ${{ inputs.install == 'true' && 'pip' || '' }}
    - name: Install
      if: inputs.install == 'true'
      shell: bash
      run: python -m pip install --require-hashes -r requirements.txt

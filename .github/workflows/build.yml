name: Build packs

on:
  schedule:
    - cron: "17 4 3 * *"  # monthly, 3rd day 04:17 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Country ids from countries.json, space separated (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Golden tests
        run: python -m pytest -q
      - name: Download, build and check packs
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: python scripts/ci_build.py build --countries "$COUNTRIES"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(date -u +%Y-%m-%d)
          tag=$base
          n=2
          while gh release view "$tag" >/dev/null 2>&1; do tag="$base-$n"; n=$((n + 1)); done
          python -m orpk manifest --release "$tag" --pack-dir dist -o dist/packs.json
          python scripts/ci_build.py notes dist/packs.json > dist/notes.md
          gh release create "$tag" dist/*.orpk dist/packs.json \
            --title "$tag" --notes-file dist/notes.md --target "$GITHUB_SHA"

name: Build packs

on:
  schedule:
    - cron: "17 4 3 * *"  # monthly, 3rd day 04:17 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Country ids from countries.json, space separated (empty = all; others are carried over)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-packs
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  countries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: List countries
        id: list
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: |
          ids=$(python -m scripts.ci_build list --countries "$COUNTRIES")
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  # One job per country: downloads and builds run in parallel, a failed country can be re-run alone.
  build:
    needs: [test, countries]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false  # keep the other packs, so "Re-run failed jobs" repeats only the failed country
      matrix:
        country: ${{ fromJSON(needs.countries.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download, build and check pack
        env:
          COUNTRY: ${{ matrix.country }}
        run: python -m scripts.ci_build build --countries "$COUNTRY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pack-${{ matrix.country }}
          path: dist/${{ matrix.country }}.orpk
          if-no-files-found: error
          retention-days: 3  # long enough to re-run a failed country
          compression-level: 0  # cell blocks are already deflated

  release:
    needs: [countries, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pack-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT: ${{ join(fromJSON(needs.countries.outputs.ids), ' ') }}
        run: python -m scripts.ci_build release --built "$BUILT" --target "$GITHUB_SHA"
